name: Keep the latest release and the one before it

# Publishing a release deletes every other release except the one published just before it, so a
# download link someone was given keeps working through the next build. Ordered by publish time
# (a release's createdAt is its commit's date). Drafts are deleted too.
# Tags of test builds (build-<commit>) go with their release; version tags (v*) stay in git.

on:
  release:
    types: [published]
  # release.yml's own releases start no workflow: it calls this one with the tag it published.
  workflow_call:
    inputs:
      keep:
        type: string
        required: true

concurrency:
  group: release-cleanup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: arc-runner-set-foreverguide
    steps:
      # Our cluster's runner (arc-runner-set-foreverguide, decepticon.io) is the bare actions-runner image:
      # what a step needs and the image lacks is installed from Ubuntu's packages.
      - name: Tools
        run: |
          missing=""
          for tool in gh jq; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
          if [ -n "$missing" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $missing; fi
      - name: Delete releases older than the previous one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep || github.event.release.tag_name }}
        run: |
          gh release list --limit 1000 --json tagName,publishedAt |
          jq -r --arg keep "$KEEP" '[.[] | select(.tagName != $keep)] | sort_by(.publishedAt // "") | reverse | .[1:] | .[].tagName' |
          while read -r tag; do
            case "$tag" in
              build-*) gh release delete "$tag" --yes --cleanup-tag ;;
              *)       gh release delete "$tag" --yes ;;
            esac
            echo "deleted release $tag"
          done
