name: Check addon

# Changes reach main only through PRs (the main ruleset requires this job), so PRs are what's checked.
on:
  pull_request:

permissions:
  contents: read

# A newer push to a PR supersedes its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-set-foreverguide
    steps:
      - uses: actions/checkout@v5
      # Our cluster's runner (arc-runner-set-foreverguide, decepticon.io) is the bare actions-runner image:
      # what a step needs and the image lacks is installed from Ubuntu's packages.
      - name: Tools
        run: |
          missing=""
          for tool in lua5.1 python3 git; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
          if [ -n "$missing" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $missing; fi
      - name: Test engine
        run: lua5.1 tools/test/run_tests.lua
      # Guides/, Data/ and Nav/ are published by the maintainer's route planner and data build and run with
      # the addon's full permissions: they must be data and nothing else.
      - name: Guides and data are data only
        run: lua5.1 tools/test/check_data_only.lua
      # Only the maintainer publishes routes and data; a fork's PR may not change them.
      - name: Routes and data come from the publisher
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          changed="$(git diff --name-only FETCH_HEAD HEAD -- Guides Data Nav)"
          if [ -n "$changed" ]; then
            echo "This PR changes published routes or data; report a wrong step as an issue instead:"
            echo "$changed"
            exit 1
          fi
      - name: Test data tools
        run: python3 tools/test/test_decode_share.py
      - name: Check Forever API paths
        run: |
          source="$RUNNER_TEMP/forever-ui-source"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/Gethe/wow-ui-source.git
          git -C "$source" sparse-checkout set Interface/AddOns/Blizzard_APIDocumentationGenerated
          git -C "$source" fetch -q --depth 1 --filter=blob:none origin bd2470aed543f72697a044e989285b6c83e63f73
          git -C "$source" checkout -q --detach FETCH_HEAD
          python3 tools/check_forever_api.py "$source"
      - name: Check release ZIP
        run: |
          python3 tools/test/test_package.py
          python3 tools/package.py
          python3 tools/check_package.py
