name: Check addon

# Changes reach main only through PRs (the main ruleset requires this job), so PRs are what's checked.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR can restore caches saved on main, not on another PR: keep the built Lua cached on main.
  lua-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds Lua 5.1.5 from lua.org once, then restores it from the Actions cache.
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"
      - name: Name it lua5.1
        run: ln -s lua "$GITHUB_WORKSPACE/.lua/bin/lua5.1"
      - name: Test engine
        run: lua5.1 tools/test/run_tests.lua
      - name: Validate guide sources
        run: python3 tools/compile_guides.py --check
      - name: Packed data matches its tables
        run: lua5.1 tools/pack_data.lua --check
      - name: Test data tools
        run: |
          python3 tools/test/test_compile_guides.py
          python3 tools/test/test_merge_recorded.py
          python3 tools/test/test_decode_share.py
          python3 tools/test/test_collect_reports.py
      - name: Check Forever API paths
        run: |
          source="$RUNNER_TEMP/forever-ui-source"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/Gethe/wow-ui-source.git
          git -C "$source" sparse-checkout set Interface/AddOns/Blizzard_APIDocumentationGenerated
          git -C "$source" fetch -q --depth 1 --filter=blob:none origin bd2470aed543f72697a044e989285b6c83e63f73
          git -C "$source" checkout -q --detach FETCH_HEAD
          FOREVER_UI_SOURCE="$source" python3 tools/test/test_forever_api.py
          python3 tools/check_forever_api.py "$source"
      - name: Check release ZIP
        run: |
          python3 tools/test/test_package.py
          python3 tools/package.py
          python3 tools/check_package.py
